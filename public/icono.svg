<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Historia del Arte">
  <!-- Fondo a sangre completa (tema oscuro) para que funcione también como icono maskable. -->
  <rect width="512" height="512" fill="#0a0b0a"/>
  <!-- Monograma "A" de Arte, trazo limpio y centrado dentro de la zona segura maskable. -->
  <g fill="none" stroke="#b8f0a0" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M172 382 L256 132 L340 382"/>
    <line x1="196" y1="312" x2="316" y2="312"/>
  </g>
  <!-- Base sutil que ancla el motivo. -->
  <line x1="168" y1="418" x2="344" y2="418" stroke="#b8f0a0" stroke-width="12" stroke-linecap="round" opacity="0.55"/>
</svg>
